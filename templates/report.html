<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Interview Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .report-paper {
            background: white;
            padding: 40px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 40px auto;
            border-radius: 8px;
        }
        /* Style untuk output Markdown */
        h1, h2, h3 { color: #2c3e50; margin-top: 20px; }
        blockquote { border-left: 4px solid #3498db; padding-left: 15px; color: #555; background: #f1f8ff; padding: 10px; }
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="report-paper">
            <div class="text-center mb-5 border-bottom pb-3">
                <h1 class="fw-bold">📑 FINAL EVALUATION REPORT</h1>
                <p class="text-muted">Generated by AI Interview Simulator</p>
            </div>
            
            <div class="content">
                {{ report_content | safe }}
            </div>
            
            <div class="text-center mt-5 no-print">
                <button onclick="window.print()" class="btn btn-dark">🖨️ Cetak / Simpan PDF</button>
                <a href="/" class="btn btn-outline-primary">🔄 Mulai Baru</a>
            </div>
        </div>
    </div>
</body>
</html>
